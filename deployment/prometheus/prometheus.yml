global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'django'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'junkbin-backend'

  - job_name: 'nginx'
    metrics_path: /stub_status
    scrape_interval: 10s
    static_configs:
      - targets: ['nginx:80']
        labels:
          service: 'junkbin-nginx'
