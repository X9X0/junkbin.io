# Junkbin.io Nginx Configuration - LOCAL DEVELOPMENT
# No SSL required - for local testing only

upstream backend {
    server backend:8000;
}

upstream grafana {
    server grafana:3000;
}

upstream prometheus {
    server prometheus:9090;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    # Merge location-level add_header with the http-level security headers
    # (see junkbin.conf).
    add_header_inherit merge;

    root /usr/share/nginx/html;
    index index.html;

    # Service worker — must not be cached
    location /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed assets — immutable, cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Frontend - React SPA (index.html must never be cached)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # API requests
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        # Django sets its own security headers - don't duplicate them
        add_header_inherit off;
    }

    # Crawler files - generated by Django so URLs follow the request host
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header_inherit off;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header_inherit off;
    }

    # Static files (Django)
    location /static/ {
        alias /usr/share/nginx/static/;
    }

    # Private message attachments - not directly requestable. Served only via
    # X-Accel-Redirect from MessageAttachmentDownloadView, which checks the
    # requester is actually a participant in that conversation first.
    location ^~ /media/messages/ {
        internal;
        alias /usr/share/nginx/media/messages/;
    }

    # Media files (user uploads)
    location /media/ {
        alias /usr/share/nginx/media/;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Nginx stub_status for Prometheus scraping (internal only)
    location /stub_status {
        stub_status;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
    }

    # Grafana
    location /grafana/ {
        proxy_pass http://grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana WebSocket
    location /grafana/api/live/ {
        proxy_pass http://grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Prometheus UI/API - staff only. It has no auth of its own, so gate it on
    # a Django admin session. Grafana reaches Prometheus directly on the
    # Docker network, not through here.
    location /prometheus/ {
        auth_request /_auth/staff;
        error_page 401 403 = @staff_login;
        proxy_pass http://prometheus;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Staff-session check for the auth_request-guarded locations above.
    location = /_auth/staff {
        internal;
        proxy_pass http://backend/api/auth/staff-check/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @staff_login {
        return 302 /admin/login/?next=$request_uri;
    }

    # Prometheus metrics endpoint
    location /metrics {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }
}
