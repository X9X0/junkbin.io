# Junkbin.io Nginx Configuration

upstream backend {
    server backend:8000;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name junkbin.io www.junkbin.io;
    return 301 https://$server_name$request_uri;
}

# HTTP access via IP - RESTRICTED for security
# Only health check and static assets allowed over HTTP
# Admin and API require HTTPS
server {
    listen 80;
    server_name 129.121.74.229;

    # Health check for monitoring (no sensitive data)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Static files only (no sensitive data)
    location /static/ {
        alias /usr/share/nginx/static/;
    }

    # Block admin access over HTTP - security risk
    location /admin/ {
        return 403 "Admin access requires HTTPS\n";
        add_header Content-Type text/plain;
    }

    # Block API access over HTTP - credentials would be exposed
    location /api/ {
        return 403 "API access requires HTTPS\n";
        add_header Content-Type text/plain;
    }

    # Redirect everything else to HTTPS on the domain
    location / {
        return 301 https://junkbin.io$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name junkbin.io www.junkbin.io;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/junkbin.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/junkbin.io/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # Service worker — must not be cached
    location /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed assets — immutable, cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Frontend - React SPA (index.html must never be cached)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # API requests
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Django admin
    # NOTE: If you change ADMIN_URL env var, update this location block to match
    # Default: /admin/ - can be changed to an obfuscated path like /secret-panel-xyz/
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Additional security headers for admin
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Static files (Django)
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files (user uploads)
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
        add_header Cache-Control "public";

        # Force download for potentially dangerous file types
        location ~* \.(pdf|doc|docx|xls|xlsx)$ {
            add_header Content-Disposition "attachment";
            add_header X-Content-Type-Options "nosniff";
        }
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Security - deny access to sensitive files
    location ~ /\. {
        deny all;
    }
}
