services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: junkbin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-junkbin}
      POSTGRES_USER: ${POSTGRES_USER:-junkbin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-junkbin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - junkbin_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: junkbin_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - junkbin_network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: junkbinio-backend
    container_name: junkbin_backend
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
    environment: &backend-env
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-False}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@junkbin.io}
      - SERVER_EMAIL=${SERVER_EMAIL:-errors@junkbin.io}
      - FRONTEND_URL=${FRONTEND_URL:-https://junkbin.io}
      - SITE_URL=${SITE_URL:-https://junkbin.io}
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-True}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-True}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-True}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-True}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - CSP_UPGRADE_INSECURE=${CSP_UPGRADE_INSECURE:-True}
      - NEXAR_CLIENT_ID=${NEXAR_CLIENT_ID:-}
      - NEXAR_CLIENT_SECRET=${NEXAR_CLIENT_SECRET:-}
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
      - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET:-}
    volumes:
      - ./backend:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - junkbin_network

  # Celery Worker (shares backend image + env)
  celery:
    image: junkbinio-backend
    container_name: junkbin_celery
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=2
    environment: *backend-env
    volumes:
      - ./backend:/app
      - media_files:/app/media
    depends_on:
      - postgres
      - redis
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - junkbin_network

  # Celery Beat (shares backend image + env)
  celery-beat:
    image: junkbinio-backend
    container_name: junkbin_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - junkbin_network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - VITE_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
        - VITE_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID:-}
    container_name: junkbin_frontend
    restart: unless-stopped
    volumes:
      - frontend_build:/app/dist
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - junkbin_network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: junkbin_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.external-url=/prometheus/
      - --web.route-prefix=/prometheus/
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./deployment/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - junkbin_network

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:10.4.0
    container_name: junkbin_grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployment/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - junkbin_network

  # Weblate Translation Platform
  weblate:
    image: weblate/weblate:5.10
    container_name: junkbin_weblate
    restart: unless-stopped
    depends_on:
      weblate_db:
        condition: service_healthy
      weblate_redis:
        condition: service_healthy
    environment:
      - WEBLATE_SITE_DOMAIN=${WEBLATE_DOMAIN:-localhost:8082}
      - WEBLATE_SITE_TITLE=Junkbin.io Translations
      - WEBLATE_ADMIN_EMAIL=${WEBLATE_ADMIN_EMAIL}
      - WEBLATE_ADMIN_PASSWORD=${WEBLATE_ADMIN_PASSWORD}
      - WEBLATE_ADMIN_NAME=Admin
      - WEBLATE_SECRET_KEY=${WEBLATE_SECRET_KEY}
      - WEBLATE_ALLOWED_HOSTS=${WEBLATE_DOMAIN:-localhost}
      - POSTGRES_HOST=weblate_db
      - POSTGRES_DATABASE=weblate
      - POSTGRES_USER=weblate
      - POSTGRES_PASSWORD=${WEBLATE_DB_PASSWORD}
      - REDIS_HOST=weblate_redis
      - WEBLATE_EMAIL_HOST=${EMAIL_HOST:-}
      - WEBLATE_EMAIL_PORT=${EMAIL_PORT:-587}
      - WEBLATE_EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - WEBLATE_EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - WEBLATE_EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - WEBLATE_SERVER_EMAIL=${SERVER_EMAIL:-errors@junkbin.io}
      - WEBLATE_DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@junkbin.io}
      - WEBLATE_ENABLE_HTTPS=1
    volumes:
      - weblate_data:/app/data
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - junkbin_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  weblate_db:
    image: postgres:15-alpine
    container_name: junkbin_weblate_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: weblate
      POSTGRES_USER: weblate
      POSTGRES_PASSWORD: ${WEBLATE_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - weblate_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weblate"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - junkbin_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  weblate_redis:
    image: redis:7-alpine
    container_name: junkbin_weblate_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - weblate_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - junkbin_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: junkbin_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/sites-available/junkbin.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
      - static_files:/usr/share/nginx/static:ro
      - media_files:/usr/share/nginx/media:ro
      - ./deployment/nginx/ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - junkbin_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_files:
    driver: local
  static_files:
    driver: local
  frontend_build:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  weblate_data:
    driver: local
  weblate_db_data:
    driver: local
  weblate_redis_data:
    driver: local

networks:
  junkbin_network:
    driver: bridge
