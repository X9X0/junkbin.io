{% extends "admin/base_site.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'admin/css/sidebar.css' %}">
{% endblock %}

{% block branding %}
{{ block.super }}
<style>
  #system-status-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-left: 16px;
    padding: 3px 10px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: bold;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    vertical-align: middle;
    transition: background 0.3s, color 0.3s;
  }
  #system-status-indicator:hover { opacity: 0.85; }
  #system-status-indicator .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  #system-status-indicator.ssi-loading { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); }
  #system-status-indicator.ssi-loading .dot { background: rgba(255,255,255,0.3); }
  #system-status-indicator.ssi-ok { background: rgba(40,167,69,0.25); color: #2ecc40; }
  #system-status-indicator.ssi-ok .dot { background: #28a745; }
  #system-status-indicator.ssi-warn { background: rgba(255,193,7,0.25); color: #ffdc00; }
  #system-status-indicator.ssi-warn .dot { background: #ffc107; }
  #system-status-indicator.ssi-error { background: rgba(220,53,69,0.3); color: #ff6b7a; }
  #system-status-indicator.ssi-error .dot { background: #dc3545; animation: pulse-dot 1.5s ease-in-out infinite; }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
<a id="system-status-indicator" href="{% url 'admin-system-status' %}" class="ssi-loading"
   data-status-url="{% url 'admin-system-status-json' %}" title="Loading status...">
  <span class="dot"></span>
  <span class="ssi-label">Loading...</span>
</a>
<script src="{% static 'admin/js/system_status.js' %}"></script>
{% endblock %}
