<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | Junkbin.io</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #0a0e27;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #ff006e;
            text-shadow: 0 0 10px #ff006e, 0 0 20px #ff006e;
            animation: flicker 1.5s infinite;
        }
        .warning-text {
            font-size: 24px;
            color: #39ff14;
            margin: 20px 0;
            letter-spacing: 2px;
        }
        .message {
            color: #666b7a;
            margin: 20px 0;
            font-size: 16px;
        }
        .link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            border: 2px solid #00f0ff;
            color: #00f0ff;
            text-decoration: none;
            transition: all 0.3s;
        }
        .link:hover {
            background-color: #00f0ff;
            color: #0a0e27;
        }
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
            75% { opacity: 0.9; }
        }
        .circuit {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.05;
            background-image:
                linear-gradient(90deg, #00f0ff 1px, transparent 1px),
                linear-gradient(#00f0ff 1px, transparent 1px);
            background-size: 50px 50px;
        }
    </style>
</head>
<body>
    <div class="circuit"></div>
    <div class="container">
        <div class="error-code">500</div>
        <div class="warning-text">CRITICAL SYSTEM FAILURE</div>
        <p class="message">Something went wrong on our end.<br>The magic smoke has escaped from the server.</p>
        <p class="message" style="margin-top: 10px;">Our engineers have been notified and are soldering furiously.</p>
        <a href="/" class="link">ATTEMPT REBOOT</a>
    </div>
</body>
</html>
