<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found | Junkbin.io</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #0a0e27;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #ff006e;
            text-shadow: 0 0 10px #ff006e, 0 0 20px #ff006e;
            animation: glitch 2s infinite;
        }
        .warning-text {
            font-size: 24px;
            color: #00f0ff;
            margin: 20px 0;
            letter-spacing: 2px;
        }
        .message {
            color: #666b7a;
            margin: 20px 0;
            font-size: 16px;
        }
        .link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            border: 2px solid #00f0ff;
            color: #00f0ff;
            text-decoration: none;
            transition: all 0.3s;
        }
        .link:hover {
            background-color: #00f0ff;
            color: #0a0e27;
        }
        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-5px, 0); }
            94% { transform: translate(5px, 0); }
            96% { transform: translate(-5px, 0); }
            98% { transform: translate(5px, 0); }
        }
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="container">
        <div class="error-code">404</div>
        <div class="warning-text">NO USER SERVICEABLE PARTS INSIDE</div>
        <p class="message">The component you're looking for doesn't exist in our database.<br>It may have been removed, or you might have salvaged the wrong address.</p>
        <a href="/" class="link">RETURN TO MAINBOARD</a>
    </div>
</body>
</html>
