<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Junkbin.io{% endblock %}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0a0e27;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        a { color: #00f0ff; }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            border-bottom: 1px solid #00f0ff;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .tagline {
            color: #666b7a;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Junkbin.io</h1>
            <p class="tagline">NO USER SERVICEABLE PARTS INSIDE</p>
        </div>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
